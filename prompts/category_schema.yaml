  techstack:
    label: Techstack / Programmiersprachen
    question: >
      Welche Programmiersprachen bzw. Technologien werden verwendet?
      Mehrfachnennung möglich.
      Eine Programmiersprache gilt als belegt, wenn sie zwar nicht wörtlich
      genannt ist, aber durch eine explizit genannte Bibliothek, ein Framework
      oder eine Plattform eindeutig impliziert wird (z. B. OpenAI Gym → Python,
      NumPy/pandas → Python, Spring → Java, .NET → csharp_dotnet). Das ist KEINE
      Spekulation und darf kodiert werden. Fehlt jeder solche konkrete
      Anhaltspunkt, wähle `insufficient_information` statt zu raten.
      Genannte Verfahren, Algorithmen und Modellarchitekturen (z. B. SimSiam,
      ResNet, YOLO, t-SNE, Random Forest, Grad-CAM) sind KEINE Techstack-Angaben:
      erfasst werden Programmiersprachen, Frameworks, Bibliotheken, Laufzeit-
      umgebungen und Datenbanken. Aus der Methode oder der Fachdomäne auf die
      vermutlich verwendete Sprache zu schließen ist unzulässig — ein Paper, das
      ausschließlich Verfahren benennt, ist `insufficient_information`.
    multi: true
    multi_narrow: true
    active:
      - key: python
        source: seed
        description: Python.
      - key: java_jvm
        source: seed
        description: Java oder andere JVM-Sprachen (Kotlin, Scala).
      - key: javascript_web
        source: seed
        description: JavaScript/TypeScript + Web-Frontend (HTML/CSS, React, ...).
      - key: c_cpp
        source: seed
        description: C oder C++.
      - key: csharp_dotnet
