        description: >
          Linden Scripting Language (LSL): die eingebaute Skriptsprache der
          Second-Life-/OpenSim-Plattformen, mit der In-World-3D-Objekte mit
          Verhalten versehen werden.
      - key: scratch_programming_environment
        source: added
        description: >
          Scratch: visuelle, blockbasierte Programmierumgebung (auf
          Smalltalk/Squeak aufbauend), einschließlich der zugehörigen
          Player-/Laufzeitkomponenten.
      - key: alloy_language
        source: added
        description: >
          Alloy: deklarative Spezifikationssprache mit Modellfinder (Alloy
          Analyzer) zur formalen Modellierung und Analyse von Strukturen und
          Zustandsräumen. (Überschneidet sich mit
          `formal_specification_languages` als Oberkategorie.)
      - key: formal_specification_languages
        source: coder:bob
        description: >
          Umbrella category for formal specification / verification languages
          (e.g. Alloy, TLA+, Z, B-Method) used to formally model and verify
          system behaviour rather than to implement it imperatively. (Overlaps
          the existing `alloy_language` entry.)
      - key: go
        source: coder:bob
        description: >
          Go (Golang). Zählt, wenn Go als Implementierungssprache der
          beschriebenen Software genannt wird oder ein Go-spezifisches Artefakt
          angeführt ist (go.mod, Goroutines, Gin, Echo). Der bloße Einsatz von
          Werkzeugen, die zufällig in Go geschrieben sind (Docker, Kubernetes,
          Prometheus), belegt KEINEN eigenen Go-Code.
      - key: hpc_parallel_computing
        source: coder:alice
        description: >
          HPC- und Parallelisierungs-Technologien: explizit genannte Programmier-
          modelle und Laufzeitumgebungen für parallele bzw. verteilte Berechnung —
          MPI, OpenMP, PVM, CUDA/OpenCL/ROCm, OpenACC, Batch-/Scheduler-Umgebungen
          (Slurm, PBS) sowie Supercomputer-spezifische Bibliotheken. Ebenfalls
          erfasst sind APIs zur expliziten Steuerung paralleler Ausführung auf
          Shared-Memory-Systemen (z. B. libnuma/numactl, `sched_setaffinity`,
          Thread- und NUMA-Pinning) sowie Grid- und Cluster-Middleware für
          wissenschaftliches Rechnen (Globus Toolkit/OGSA, UNICORE, HTCondor).
          Diese Kategorie
          ist ADDITIV zur Implementierungssprache: eine MPI-basierte Bibliothek in C
          wird als `c_cpp;hpc_parallel_computing` kodiert. Sie zählt nur, wenn eine
          konkrete Parallelisierungstechnologie oder -API benannt ist — die bloße
          Aussage, die Software laufe auf einem Supercomputer oder Cluster, genügt
          nicht; ebenso wenig genügt die Nennung von Hardware (GPU-Modell,
          Knotenzahl) ohne zugehöriges Programmiermodell. Abzugrenzen von verteilten
          Anwendungsarchitekturen ohne HPC-Bezug (Client/Server, Web-Services), die
          über `software_type` erfasst werden. Ebenfalls NICHT erfasst sind
          Big-Data- und Dataflow-Frameworks der Datenverarbeitung (Hadoop/MapReduce,
          Apache Spark, Apache Flink, Kafka): sie skalieren Datenverarbeitung, nicht
          wissenschaftliches Rechnen, und werden als Host-System bzw. über
          `software_type` erfasst. Compiler-Optimierungsflags (`-march=native`,
          Auto-Vektorisierung) sind kein benanntes Parallelisierungsmodell; nur als
          künftige Möglichkeit genannte Bibliotheken (z. B. „ließe sich mit Intel MKL
          umsetzen") zählen ebenfalls nicht. Maßgeblich ist der ZWECK, nicht der
          Transport: Grid-Middleware zählt, weil sie Berechnung über Ressourcen
          verteilt, auch wenn sie technisch auf Web-Services aufsetzt; ein
          Web-Service zur Anwendungsintegration ohne Rechenverteilung zählt nicht.
          Grafik-/Rendering-Stacks (DirectX, OpenGL, Shader-Sprachen) zählen nur,
          wenn sie nachweislich für General-Purpose-Berechnung eingesetzt werden.
        examples:
          - mpi
          - openmp
          - cuda
          - globus_toolkit
          - libnuma
