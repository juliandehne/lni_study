  evaluation:
    label: Evaluation der Forschungssoftware
    question: >
      Wie wird die Forschungssoftware evaluiert? Mit welcher Methode wird ihr
      Nutzen, ihre Qualität oder ihre Wirkung belegt? Mehrfachnennung möglich
      (die Methoden bauen im Idealfall aufeinander auf).
      Wird im Paper überhaupt keine Evaluation berichtet, ist
      `insufficient_information` zu wählen — dieser Wert deckt hier beide Fälle
      ab: „nicht berichtet" und „nicht durchgeführt". Das betrifft insbesondere
      Demo-, Poster- und Kurzbeiträge, die nur Konzept und Umsetzung vorstellen.
      Eine Konferenz-Demonstration oder Vorführung allein ist KEINE
      `conceptual_evaluation` — diese verlangt eine berichtete Bewertung des
      Konzepts durch Nutzer:innen oder Expert:innen.
    multi: true
    active:
      - key: testing
        source: seed
        description: >
          Testen / Evaluate Software (M4): technischer Nachweis, dass die Software
          das tut, was sie soll — funktionale Korrektheit, Robustheit
          (Unit-/Integrationstests, Abnahme- und Zuverlässigkeitstests), ohne dass
          Versuchspersonen einbezogen werden. `performance_evaluation` und
          `benchmarking` sind demgegenüber die spezielleren Fälle (Effizienzmetrik
          bzw. geteilte kanonische Aufgabe) und gehen dort vor.
      - key: usability_study
        source: seed
        description: >
          Usability-Studie / Evaluate Usability (M3): Evaluation der Benutzbarkeit
          und Nutzererfahrung mit Versuchspersonen (z.B. Usability-Tests, SUS-/
          Fragebögen, Think-Aloud), ohne dass die Software bereits Gegenstand einer
          inhaltlichen Forschungsfrage ist.
      - key: empirical_study
        source: seed
        description: >
          Empirische Studie / Conduct Empirical Study (S1): die Software wird in
          einer empirischen Untersuchung eingesetzt, die eine inhaltliche
          Forschungsfrage beantwortet (z.B. kontrollierte Experimente, Feld- oder
          Interventionsstudien); die Software ist Mittel oder Gegenstand der
          Erkenntnisgewinnung, nicht nur das technische Artefakt.
          Ebenfalls erfasst sind numerische bzw. rechnerische Experimente auf
          synthetischen oder selbst abgeleiteten Instanzen (z. B. Rechenstudien
          zu Optimierungs- und Approximationsverfahren, Vergleich der
          Lösungsgüte gegen eine berechnete Referenz oder Schranke), sofern
          daraus eine inhaltliche Aussage gezogen wird. Abzugrenzen von
          `benchmarking` (dort geteilte kanonische Evaluationsaufgabe) und von
          `performance_evaluation` (dort Ressourcen- bzw. Effizienzmetriken).
      - key: conceptual_evaluation
        source: coder:alice
        description: Konzeptionelle Evaluation ist die Vorstellung des Gesamtkonzeptes bei Nutzer:innen oder Expert:innen und die Software wird basierend auf dem Konzept alleine bewertet
      - key: planned
        source: coder:alice
        description: '"eine Evaluation ist geplant, wenn das Konzept dargestellt ist, aber die Durchführung in der Zukunft liegt. Maßgeblich ist, ob im Paper Ergebnisse berichtet werden — nicht, ob die Erhebung bereits angelaufen ist: ein laufender, aber noch nicht ausgewerteter Feldeinsatz oder Nutzerbetrieb ohne berichtete Befunde ist `planned` und nicht `empirical_study`.'
      - key: benchmarking
        source: coder:alice
        description: "Wissenschaftliches Benchmarking: Evaluation auf einer bekannten kanonischen Aufgabe bzw. einem Standard-Datensatz zur feldweiten Vergleichbarkeit (z.B. Accuracy/Qualität auf einem geteilten Benchmark, Leaderboard-Vergleich), unabhängig von der Metrik. Abgrenzung zu `performance_evaluation`: dort geht es um Ressourcen-/Effizienzmetriken, hier um die Vergleichbarkeit auf einer geteilten kanonischen Aufgabe. Geteilt sein muss die EVALUATIONSAUFGABE, nicht die Datenquelle: der Vergleich mehrerer eigener Konfigurationen oder Baselines auf einem nicht veröffentlichten Datensatz ist kein Benchmarking, auch wenn öffentliche Standard-Datensätze als Trainings-, Pretraining- oder Kalibrierungsquelle dienen. Erheben die Autor:innen ihr Testmaterial selbst, weil kein geeigneter geteilter Datensatz existiert, greift die Kategorie ebenfalls nicht."
      - key: performance_evaluation
        source: coder:alice,alice.backup-2026-06-19
        examples:
          - performance evaluation
        description: "Performanzevaluation: die Research Software wird hinsichtlich Ressourcen- bzw. Effizienzmetriken gemessen (z.B. Geschwindigkeit/Laufzeit, Speicher- oder Energieverbrauch, Modell-Footprint) — mit oder ohne kanonische Aufgabe. Abgrenzung zu `benchmarking`: dort steht die Vergleichbarkeit auf einer bekannten kanonischen Aufgabe/einem Standard-Datensatz im Vordergrund (unabhängig von der Metrik), hier die Effizienzmetrik selbst. Beide können gemeinsam zutreffen, wenn ein Standard-Datensatz UND Effizienzmetriken berichtet werden."
      - key: alternatives_comparison
        source: coder:alice
        # 2026-07-31: description filled from the single coded use
        # (lni71/GI-Proceedings.71-13, alongside benchmarking und
        # performance_evaluation). Until now the entry was active but
        # description-less and therefore SILENTLY DROPPED from the model prompt.
        description: >
          Vergleich mit Alternativen: die Forschungssoftware bzw. der von ihr
          umgesetzte Ansatz wird systematisch gegen alternative Lösungen gestellt
          — bestehende Werkzeuge oder Systeme, Vorgängerversionen, konkurrierende
          Verfahren oder eigene Konfigurations- und Verfahrensvarianten — und das
          Ergebnis des Vergleichs wird berichtet. Die bloße Erwähnung verwandter
          Arbeiten genügt nicht. Abgrenzung: `benchmarking` verlangt eine
          geteilte kanonische Evaluationsaufgabe, `performance_evaluation` eine
          Ressourcen-/Effizienzmetrik; alle drei können gemeinsam zutreffen.
    rejected: []
    candidates: []
