# category_schema.yaml
#
# SOURCE OF TRUTH for the RSE typology used in the LNI study. Read by
# src/categories.py (via schema_io.py) to build the annotation prompt, and
# edited by the category-narrowing loop (src/narrow_categories.py). The old
# prompts/category_whitelist.json is retired.
#
# Per dimension:
#   active     - the subcategories the prompt offers the model. An ACTIVE entry
#                with an empty `description:` is EXCLUDED from the prompt (and a
#                warning is printed) until you fill the description in. An optional
#                `examples:` list holds alternate subcategory names that were merged
#                INTO this one; they are rendered after the description as a synonym
#                whitelist ("auch: ...") and are NOT re-offered as new candidates.
#                An optional `deprecated: true` flag keeps the subcategory as a
#                KNOWN/legacy value (previously-coded rows stay valid and are NOT
#                treated as new) but DROPS it from the generated model prompt.
#   rejected   - subcategories the human ruled out (reason + optional move_to);
#                rendered as "do not use" guidance in the prompt.
#   candidates - merge-not-clobber inbox the loop's `collect` step appends the
#                model's new_suggestion subcategories to; `review` (or editing
#                this file) promotes each into active/rejected.
#
# Edited BY HAND between narrowing rounds (rename, merge, fill descriptions) or
# via `run_pipeline.cmd review`. ruamel round-trips this file, so comments and
# layout survive the loop's automated edits. Generated 2026-06-17 from the state
# after the first `review` pass (source_candidates: category_candidates_narrow.csv).
#
# 2026-07-31 — external review pass (Kategoriensystem feedback). Descriptions were
# rewritten to be DEFINITIONAL and self-contained, so this file can be exported 1:1
# as the typology table of the paper (no rationale-of-the-day prose, no meta text
# about why a category was proposed). Concrete enumerations were added where the
# reviewer asked for them: naming exemplars ("SAT-Solver", "Beweisassistent")
# raises the model's attention on the term instead of relying on knowledge buried
# in the weights. INVARIANT of this pass: no `key` was renamed, added, removed or
# re-scoped — every already-coded row still resolves and NOTHING IS RE-CODED
# (strict no-recoding policy until the deadline). Some of the sharpened wordings
# do shift a boundary, so a few rows were decided under the earlier definition;
# which ones is recorded in ../SCHEMA_CHANGELOG.md — that file is documentation
# only and is read by nothing in src/.
# Note on `examples:` — that field is the SYNONYM WHITELIST of subcategory names
# merged INTO an entry (rendered as "auch: ..."); illustrative examples belong in
# the description prose, not there.

gate:
  key: label_research_software
  definition_de: >
    Forschungssoftware umfasst Quellcode-Dateien, Algorithmen, Skripte,
    rechnergestützte Arbeitsabläufe (Workflows), Bibliotheken und ausführbare
    Programme, die zu einem Forschungszweck erstellt, erweitert oder maßgeblich
    angepasst wurden. Die bloße Anwendung allgemein verfügbarer Standardsoftware
    ohne eigene Entwicklungsleistung gilt NICHT als Forschungssoftware.
    Entscheidend ist, dass die Software im Rahmen der beschriebenen Arbeit
    tatsächlich umgesetzt (erstellt, erweitert oder angepasst) wurde. Bloße
    Konzepte, Visionen, Vorschläge, Referenz- bzw. IT-Gesamtarchitekturen,
    Rollenmodelle, Metamodelle, Vorgehens-/Methodenbeschreibungen oder
    Spezifikationen eines Systems — ebenso wie nur geplante oder angestrebte
    Technologien und Schnittstellen ("soll", "angestrebt", "geplant"), die
    (noch) nicht implementiert sind — gelten NICHT als Forschungssoftware.
    Auch die bloße Beschreibung, Referenzierung oder Anwendung bereits
    bestehender, extern entwickelter Software (auch wenn sie im Projektumfeld
    entstand) erfüllt das Kriterium nicht, solange in der beschriebenen Arbeit
    selbst keine eigene Entwicklungsleistung an der Software erbracht wurde.
    Ebenso gilt Software, deren alleiniger Zweck ein kommerzielles,
    administratives oder betriebliches Produkt ist (z. B. ein Webshop, ein
    Verwaltungs- oder Buchungssystem) und die keine Forschungsfrage untersucht,
    keinen Forschungsprozess unterstützt und keine wissenschaftliche Erkenntnis
    hervorbringt, NICHT als Forschungssoftware — auch dann nicht, wenn sie im
    akademischen Umfeld entstanden und vollständig implementiert ist. Der
    Forschungszweck (nicht allein die eigene Entwicklungsleistung oder die
    akademische Urheberschaft) ist ausschlaggebend.

dimensions:

  # The dimension KEY stays `research_position` for data compatibility (it is the
  # `dimension` value in every goldstandard/coding_*.csv row and in the model
  # checkpoints). Only the human-facing label/question were reframed 2026-07-31
  # from "position" to "purpose": the categories always described what the
  # software is FOR, not when it runs — a data analysis can sit at the start or
  # at the end of a study and is `datenanalyse` either way.
  research_position:
    label: Zweck im Forschungsprozess (research purpose)
    question: >
      Welchen Zweck erfüllt die Forschungssoftware im Forschungsvorhaben? Wofür
      wird sie eingesetzt?
      Gefragt ist der ZWECK, nicht die zeitliche Stelle im Ablauf: eine
      Datenanalyse kann explorativ am Anfang oder auswertend am Ende einer Studie
      stehen und ist in beiden Fällen `datenanalyse`.
      Wichtig: Die prozessbezogenen Kategorien (Datenerhebung, Datenanalyse,
      Simulation/Modellierung, Mensch-zugewandte Intervention,
      Visualisierung/Dissemination) gelten nur, wenn die Software diese Funktion
      für ein explizit genanntes übergeordnetes Forschungsziel erfüllt — nicht
      schon, weil sie es technisch könnte. Mündet der Forschungsprozess allein
      in der Software selbst (mögliche künftige Nutzung), ist sie
      `product_result` oder `proof_of_concept_product`.
    multi: false
    active:
      - key: datenerhebung
        source: seed
        description: >
          Datenerhebung / data acquisition: die Software erzeugt oder erfasst die
          Forschungsdaten selbst — Sensorik und Messdatenerfassung, (Web-)Crawler
          und Scraper, Logging- und Tracking-Komponenten, digitale
          Erhebungsinstrumente (Fragebogen-, Experiment- und
          Beobachtungssoftware, Apps zur Datenaufnahme).
          Diese Fälle sind technisch bewusst heterogen (hardwarenahe
          Sensor-Firmware vs. objektorientierter Crawler); die Bauform wird in
          `software_type` (z. B. `embedded_hardware`, `analysis_pipeline`,
          `full_stack_application`) und in `techstack` erfasst, nicht hier.
      - key: datenanalyse
        source: seed
        description: >
          Datenanalyse / data analysis (Statistik, Auswertung, ML-Pipelines):
          die Software analysiert Daten für ein explizit genanntes
          übergeordnetes Forschungsziel. Die bloße Analysefähigkeit der Software
          genügt nicht — mündet der Prozess nur in der Software (künftige Nutzung
          denkbar), ist sie `product_result` oder `proof_of_concept_product`.
      - key: simulation_modellierung
        source: seed
        description: >
          Simulation oder Modellierung (numerische Modelle, Agentenmodelle,
          diskrete Ereignissimulation): ein realweltliches Phänomen wird durch
          die Forschungssoftware nachgebildet, so dass synthetische Ergebnisse
          erzeugt und mit empirischen Ergebnissen verglichen werden können.
      - key: human_facing_intervention
        source: seed
        description: >
          Mensch-zugewandte Intervention: ein System, mit dem Versuchspersonen
          unmittelbar interagieren und dessen Einsatz Teil des Forschungsdesigns
          ist (z. B. Lern- und Trainingsumgebungen, Assistenz- und
          Feedbacksysteme, Anwendungen für Interventions-, Labor- oder
          Feldstudien).
      - key: visualisierung_dissemination
        source: seed
        description: >
          Visualisierung oder Dissemination: die Software bereitet Forschungsdaten
          oder -ergebnisse für Menschen auf und vermittelt sie (z. B. Dashboards,
          interaktive Abbildungen, Visual-Analytics-Oberflächen, Portale zur
          Ergebnispräsentation).
      - key: formal_verification
        source: added
        description: >
          Formale Verifikation oder Beweisführung: die Software dient dem formalen
          Nachweis von Eigenschaften eines Systems, Modells oder einer
          Spezifikation — Theorembeweiser, Beweisassistenten,
          Modellprüfungssoftware (Model Checker), SMT-Solver, SAT-Solver,
          Spezifikations- und Verifikationswerkzeuge, Programmanalyse-Software.
          Formale Verifikation ist eine eigene Form von RSE und folgt einem
          eigenen Prozess, daher ein eigener Zweck. Abzugrenzen von der
          Lebenszyklus-Phase `testen_qualitaetssicherung` (empirische
          Qualitätssicherung am Artefakt) und von der Dimension `evaluation`.
      - key: research_infrastructure_support
        source: added
        description: >
          Bereitstellung von Forschungs- bzw. Entwicklungsinfrastruktur: Zweck der
          Software ist es, Forschungs- und Software-Entwicklungsprozesse zu
          unterstützen, statt selbst eine inhaltliche Forschungsfrage zu
          bearbeiten — Versionsverwaltung, Aufgaben- und Fehlerverwaltung,
          kontinuierliche Integration, Build- und Testinfrastruktur, Plattformen
          für das kollaborative Arbeiten in Forschungs- und
          Entwicklungsprojekten. Erfasst wird die in der beschriebenen Arbeit
          selbst entwickelte Infrastruktursoftware; der bloße Betrieb oder die
          Verwaltung vorhandener IT-Infrastruktur zählt nicht (vgl. abgelehnt:
          `research_infrastructure_management`).
      # 2026-07-31: `proof_of_concept_product` now precedes `product_result` so the
      # latter's Abgrenzung refers back to a definition the reader/model already
      # has in context. The DECISION RULE is unchanged (single new
      # algorithm/method vs. the built or integrated system as the deliverable) —
      # this is a wording and ordering change only, no row needs re-coding.
      - key: proof_of_concept_product
        source: coder:alice
        description: >
          Machbarkeitsnachweis: Kern des Beitrags ist ein einzelner neuer
          Algorithmus bzw. eine neue Methode. Ziel der Arbeit ist, diesen
          Algorithmus zu entwickeln; die Software setzt ihn prototypisch um und
          zeigt, dass er funktioniert. Das Ergebnis der Forschung ist die
          Erkenntnis über den Algorithmus, die Software ist das Vehikel für
          seinen Machbarkeitsnachweis.
      - key: product_result
        source: coder:bob
        description: >
          Die Software selbst ist Produkt und Ziel der Forschung: der Beitrag ist
          das gebaute bzw. integrierte lauffähige System oder seine Architektur —
          auch dann, wenn es bestehende Bausteine neu integriert oder erweitert
          und als "Pilot" oder "reference implementation" bezeichnet bzw. real
          deployt wird.
          Entscheidungsregel gegenüber `proof_of_concept_product`: steht ein
          einzelner neuer Algorithmus im Zentrum, ist es
          `proof_of_concept_product`; ist das System bzw. die Architektur das
          Deliverable, ist es `product_result`.
          Maßgeblich ist die EINHEIT DES BEITRAGS, nicht der Reifegrad: ein
          unfertiger, nur im Labor lauffähiger Systembau ist `product_result`,
          wenn das System der Beitrag ist; ein produktiv betriebenes System
          bleibt `proof_of_concept_product`, wenn der Beitrag ein einzelner neuer
          Algorithmus ist. Reifegrad bzw. TRL ist eine andere Achse und wird hier
          NICHT kodiert.
    rejected:
      - key: infrastruktur_tooling
        was: seed
        reason: >
          Belongs to TYPE of software, not the position in the research process.
        move_to: software_type
      - key: research_infrastructure_management
        reason: >
          Gemeint war das Verwalten und Betreiben vorhandener Forschungs- und
          IT-Infrastruktur (Rechen-, Speicher- und Dienstbetrieb). Das ist kein
          Zweck innerhalb eines konkreten Forschungsprozesses und fällt nicht
          unter die engere Definition von Forschungssoftware.
          Kein Widerspruch zum aktiven `research_infrastructure_support`: dort
          wird in der beschriebenen Arbeit selbst Infrastruktursoftware
          ENTWICKELT, die Forschungs- und Entwicklungsprozesse unterstützt; hier
          geht es um den BETRIEB bereits bestehender Infrastruktur, der ohne
          eigene Entwicklungsleistung ohnehin schon am Gate scheitert.
      - key: testing
        was: coder:alice
        reason: >
          Removed as a research_position category (2026-07-16). "Testing" as a
          *position in the research process* overlaps the `evaluation` dimension's
          `testing` (M4, technical correctness) and the software-lifecycle phase
          `testen_qualitaetssicherung`. The position dimension should capture WHERE
          in the research process the software sits; testbed / benchmark-harness
          cases should be coded by their actual process role (e.g. `datenanalyse`,
          `simulation_modellierung`) or as `product_result` /
          `proof_of_concept_product`, with the testing aspect captured under
          `evaluation`.
        move_to: evaluation
    candidates: []
  software_lifecycle:
    label: Phase im Software-Lebenszyklus
    question: >
      Welche Phase(n) des Software-Lebenszyklus behandelt das Paper im Bezug auf
      die Forschungssoftware? Mehrfachnennung möglich (die Phasen bauen im
      Idealfall aufeinander auf).
    multi: true
    # Seeds from software_prozesskategorien.md (2026-06-19): the six classical
    # software-lifecycle phases. This dimension REPLACES the former `methodology`
    # dimension ("Dies statt der Methodologiefrage"). Coders refine via the
    # narrowing loop (candidates -> active/rejected) and the goldstandard `new`
    # option as usual.
    active:
      - key: projektdefinition
        source: seed
        description: >
          Projektdefinition / -hintergrund: Ideenfindung, Vision, Design-Idee,
          Stakeholder- und Kundenbezug, Motivation und Problemraum — der Schritt,
          bevor formale Anforderungen festgehalten werden.
          Operationalisierung: Die Kategorie greift, wenn das Paper aus dem
          Problemraum oder der verwandten Arbeit eine ZIELBESTIMMUNG für die
          eigene Software ableitet — also die Lücke benennt und daraus folgert,
          was das Artefakt leisten muss. Nicht ausreichend sind eine bloße
          motivierende Einleitung, ein Related-Work-Abschnitt als reiner
          Methoden- oder Systemüberblick oder Lehrbuch-Hintergrund ohne Bezug
          zur eigenen Zielsetzung.
      - key: anforderungen
        source: seed
        description: >
          Anforderungen / Requirements Engineering: Erhebung, Analyse und
          Spezifikation funktionaler und nicht-funktionaler Anforderungen.
      - key: entwurf
        source: seed
        description: >
          Entwurf / Design: Architektur, Modellierung, Schnittstellen- und
          Komponentendesign der Software.
      - key: implementierung
        source: seed
        description: >
          Implementierung: konkrete Umsetzung in Code (Programmierung, Integration
          von Komponenten, Werkzeuge der Entwicklung).
      - key: testen_qualitaetssicherung
        source: seed
        description: >
          Testen / Qualitätssicherung: Verifikation und Validierung, Tests,
          Qualitätssicherung und Fehlerbehebung. (Abzugrenzen von der Dimension
          `evaluation`, die den Nachweis von Nutzen/Wirkung der Software betrifft.)
          Diese Kategorie verlangt Qualitätssicherung am Artefakt selbst — Unit-
          und Integrationstests, Code-Reviews, statische Analyse, systematische
          Fehlerbehebung, Zuverlässigkeits- oder Abnahmetests des Systems.
          Messungen der Ergebnisqualität oder der Forschungsleistung (Accuracy,
          F1, Fehler- und Erkennungsraten, Laufzeitvergleiche, Nutzerstudien)
          gehören NICHT hierher, sondern ausschließlich in die Dimension
          `evaluation` — auch dann nicht, wenn das Paper sie als "Test" oder
          "Validierung" bezeichnet.
      - key: deployment_betrieb
        source: seed
        description: >
          Deployment / Betrieb: Auslieferung, Installation, Inbetriebnahme,
          Wartung und laufender Betrieb der Software. Es sollten klare längerfristige Schritte der Nutzung und Verwertung erklärt sein.
    rejected: []
    candidates: []
  software_type:
    label: Art der Software
    question: Um welche Art von Software handelt es sich technisch?
    multi: true
    # `archetype:` (added 2026-07-31) is REPORTING METADATA and is NOT read by
    # src/ — it never reaches the model prompt and never changes a coded value.
    # Es beantwortet den Review-Einwand, dass diese Dimension zwei Achsen mischt:
    # die AUSLIEFERUNGSFORM (wie wird die Software übergeben?) und den
    # ARCHITEKTUR-ARCHETYP (Transformation / eingebettet / interaktiv). Keys mit
    # `archetype: delivery_form` benennen nur die Auslieferungsform; ihr Archetyp
    # wird beim Reporten aus `research_position` abgeleitet — siehe den
    # `reporting:`-Block am Dateiende.
    active:
      - key: script
        source: seed
        archetype: transformation
        deprecated: true
        deprecated_reason: >
          2026-07-27 stillgelegt und aufgeteilt: mathematische Berechnungskerne
          gehen in `numerical_mathematical`, lineare Datenanalyse (inkl.
          Command-Line-Analysewerkzeuge und Notebooks) in `analysis_pipeline`.
          Nicht mehr im Modell-Prompt angeboten. Bleibt als Legacy-Kategorie
          gültig, damit bereits kodierte Altfälle nicht als neue Kategorie
          behandelt werden.
        description: >
          Skript / lineare Analyse: kleine, oft einzelne Ausführungsfäden oder
          lineare Programme, die Analyseschritte abarbeiten (interaktive Schritte
          möglich) — inklusive Command-Line-Tools mit Nutzerinteraktion und
          notebook-basierter Analyse (Jupyter, R Markdown).
        examples:
          - cmd_tool
          - analysis_pipeline
          - notebook
      - key: library_package
        source: seed
        archetype: delivery_form
        description: >
          Bibliothek, Paket, Framework oder SDK (zur Wiederverwendung durch andere),
          inkl. Test-Automatisierungs-Frameworks und Testcode-Generatoren.
          Entscheidend ist die Auslieferungsform: Dritte bauen das Artefakt in ihre
          eigene Software ein und rufen es über eine API/Schnittstelle auf.
          Abgrenzung zu `analysis_pipeline`: der interne Aufbau ist unerheblich —
          ein SDK, das intern eine Verarbeitungskette (Preprocessing,
          Feature-Extraktion, Klassifikation) ausführt, bleibt `library_package`,
          weil das Deliverable die wiederverwendbare Komponente ist und nicht ein
          durchgeführter Analyse-Lauf.
        examples:
          - matching_framework
          - analysis_toolkit
          - feature_detection_toolkit
          - test_automation_framework
          - testing_framework
          - test_code_generator
      - key: full_stack_application
        source: seed
        archetype: interactive
        description: >
          Full-Stack-Anwendung: interaktive Endnutzer-Anwendung mit eigener
          Oberfläche, typischerweise Frontend + Backend und häufig webbasiert.
          Ein Backend ist nicht zwingend — auch reine Client- bzw. Desktop-,
          Tablet- und Touch-Anwendungen (z. B. Lernspiele, Simulatoren mit GUI)
          fallen hierunter, sofern sie nicht besser durch `script`,
          `vr_application`, `plugin_extension` oder `middleware_service`
          beschrieben sind. Maßgeblich ist, dass das Artefakt als eigenständige
          Anwendung von Endnutzer:innen bedient wird.
        examples:
          - e_learning_multimedia_system
          - middleware_data_processing_system
      - key: numerical_mathematical
        source: seed
        archetype: transformation
        description: >
          Numerisch/mathematisch fokussierte Software: eigenständiger
          Berechnungs- bzw. Lösungskern (Solver, numerische Integratoren,
          Verfahren der linearen Algebra, Optimierungs- und
          Approximationsverfahren, FEM-/Simulationskerne, Beweis- und
          Verifikationskerne wie SAT-/SMT-Solver oder Theorembeweiser).
        examples:
          - verification_tool
          - theorem_prover
      - key: analysis_pipeline
        source: added
        archetype: transformation
        description: >
          Analyse-Pipeline / lineare Datenanalyse: Programme oder verkettete
          Verarbeitungsschritte, die Daten sequentiell einlesen, transformieren
          und auswerten (z.B. Preprocessing, Feature-Extraktion, Klassifikation,
          Erkennung). Der Fokus liegt auf dem Datenanalyse-Ablauf — abzugrenzen
          von `numerical_mathematical` (eigenständiger mathematischer
          Berechnungskern / Solver) und `library_package`. Schließt
          Command-Line-Analysewerkzeuge und notebook-basierte Analysen (Jupyter,
          R Markdown) ein.
          Abgrenzung zu `library_package` nach der Auslieferungsform, nicht nach
          dem inneren Aufbau: `analysis_pipeline` wählen, wenn das Artefakt selbst
          ausgeführt wird, um Daten zu verarbeiten und Ergebnisse zu erzeugen —
          Deliverable ist der Analyse-Lauf bzw. dessen Output. `library_package`
          wählen, wenn das Artefakt als Bibliothek/SDK/API an Dritte übergeben und
          von deren Software aufgerufen wird; eine Verarbeitungskette im Inneren
          macht daraus keine `analysis_pipeline`. Bei Software, die primär als
          Komponente eines Produkts ausgeliefert wird, geht `library_package` vor.
        examples:
          - cmd_tool
          - notebook
          - recognition_pipeline
      - key: embedded_hardware
        source: seed
        archetype: embedded
        description: >
          Embedded / hardwarenahe Software: Software, die unmittelbar auf oder mit
          physischer Hardware läuft (Firmware für Mikrocontroller, Sensorknoten
          und Messgeräte, Echtzeit- und Maschinensteuerung, Robotik,
          hardwarenahe Signalaufnahme).
        examples:
          - middleware_firmware
          - embedded_activity_recognition_toolkit
      - key: plugin_extension
        source: seed
        archetype: delivery_form
        description: >
          Plugin / Erweiterung eines bestehenden Wirtssystems, die nur in dessen
          Laufzeitumgebung ausgeführt wird (z. B. Moodle- oder LMS-Plugin,
          IDE-Plugin, Browser-Erweiterung, CMS-Modul, Erweiterung eines
          bestehenden Simulations- oder Analysewerkzeugs).
        examples:
          - model_simulator
          - neural_network_framework
      - key: domain_specific_language
        source: added
        archetype: transformation
        description: >
          Domänenspezifische Sprache (DSL): eigens entworfene Sprache oder
          Notation für ein spezifisches Anwendungsgebiet. Die Kategorie greift,
          wenn die Sprache selbst bzw. ihre Sprachinfrastruktur das Artefakt ist
          — Grammatik oder Metamodell, Parser, Compiler oder Generator, Editor-
          und Werkzeugunterstützung (Language Workbench).
          Wird eine DSL dagegen nur als Schnittstelle INNERHALB eines größeren
          Systems eingesetzt (Konfigurations-, Abfrage- oder
          Modellierungssprache eines Werkzeugs), ist der Typ des Gesamtsystems zu
          wählen (z. B. `full_stack_application`, `middleware_service`,
          `analysis_pipeline`).
          Architektonisch sind DSL samt Sprachinfrastruktur ein Meta-Werkzeug:
          sie überführen Spezifikationen in ausführbare (Teil-)Systeme.
      - key: vr_application
        source: added
        archetype: interactive
        description: >
          Virtual-, Augmented- oder Mixed-Reality-Anwendung: immersive Anwendung,
          die eine virtuelle bzw. erweiterte Umgebung darstellt und typischerweise
          über Head-Mounted-Display, Motion-Tracking, CAVE oder eine virtuelle
          Welt bedient wird (z. B. virtuelle Labore, VR-Trainings- und
          Lernumgebungen).
        examples:
          - mixed_reality_application
      - key: middleware_service
        source: added
        archetype: interactive
        description: "Middleware / dienstorientierte Software: verbindende Schicht zwischen Systemen — Web-Services/APIs, Proxy-Server, Workflow-Management-Systeme sowie Integrations- und Vermittlungsdienste."
        examples:
          - middleware_service_integration
          - middleware_integration_tool
      - key: ml_model
        source: coder:bob
        archetype: transformation
        description: >
          ML-Modell: Die Software IST ein Machine-Learning-Modell — die
          Modellarchitektur, der Trainings-/Inferenzcode und/oder die
          trainierten Gewichte sind das Artefakt (z.B. ein eigens trainiertes
          neuronales Netz, ein feinjustiertes Sprachmodell). Abzugrenzen von
          `analysis_pipeline` (der Verarbeitungsablauf steht im Vordergrund,
          das Modell ist nur ein Schritt darin) und von `library_package`
          (wiederverwendbares ML-Framework für Dritte, nicht das Modell selbst).
          Die bloße Anwendung eines fremden vortrainierten Modells genügt
          nicht — es muss eigenes Training, Fine-Tuning oder eine eigene
          Architektur beschrieben sein.
        examples:
          - neural_network_model
          - trained_classifier
    rejected:
      - key: web_service_api
        was: seed
        reason: More of a component than the whole type of software.
        move_to: middleware_service
      - key: proxy_server_application
        reason: All middleware and service-oriented architectures should be one category.
        move_to: middleware_service
      - key: workflow_management_system
