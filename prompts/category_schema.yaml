# ===========================================================================
# reporting: NON-COMPUTATIONAL METADATA (added 2026-07-31)
# ---------------------------------------------------------------------------
# Nothing under this key is read by src/. It reaches neither the model prompt
# nor the gold standard nor any agreement statistic. It documents how the coded
# `software_type` values are ROLLED UP for the paper. Changing it can therefore
# never invalidate a coding, and no re-coding follows from it.
#
# Hintergrund (Review 2026-07-31): `software_type` mischt bewusst zwei Achsen —
# die AUSLIEFERUNGSFORM (Bibliothek, Plugin, ...) und den ARCHITEKTUR-ARCHETYP
# (Datentransformation / eingebettet / interaktiv). Beide sind für die Kodierung
# nützlich: die Auslieferungsform ist am Paper direkt ablesbar, der Archetyp
# nicht immer. Statt die Dimension zu zerschneiden (das hieße neu kodieren),
# wird der Archetyp beim Auswerten aus den bereits kodierten Werten abgeleitet.
# ===========================================================================
reporting:
  software_type_archetypes:
    computational: false
    added: 2026-07-31
    archetypes:
      - key: transformation
        label: Datentransformationspipeline
        description: >
          Software, die Eingaben zu Ausgaben verarbeitet, ohne dass ein Mensch
          zur Laufzeit im Regelkreis steht: Analyse- und Auswertungsketten,
          numerische Löser, Simulationen, trainierte Modelle, Compiler und
          Generatoren.
      - key: embedded
        label: Eingebettetes System
        description: >
          Software, die an physische Hardware gebunden ist und mit ihr
          zusammen das Artefakt bildet — Mikrocontroller, Sensorknoten,
          Messaufbauten, Robotik-Steuerungen.
      - key: interactive
        label: Interaktives System
        description: >
          Software, deren Zweck die Interaktion mit Menschen oder anderen
          Systemen zur Laufzeit ist: Anwendungen mit Nutzeroberfläche,
          VR/AR-Umgebungen, Dienste und Middleware, die Anfragen beantworten.
    delivery_form_rule: >
      Die Keys mit `archetype: delivery_form` (`library_package`,
      `plugin_extension`) benennen nur, WIE die Software ausgeliefert wird, und
      legen den Archetyp nicht fest. Beim Reporten wird ihr Archetyp aus der
      Kodierung `research_position` desselben Papers abgeleitet:
      `datenerhebung`, `datenanalyse`, `simulation_modellierung`,
      `formal_verification` -> transformation;
      `human_facing_intervention`, `visualisierung_dissemination`,
      `research_infrastructure_support` -> interactive;
      liegt zusätzlich `embedded_hardware` als `software_type` vor -> embedded.
      Bei `proof_of_concept_product` und `product_result` — die den Beitragstyp
      und nicht den Zweck benennen — entscheidet der zweite kodierte
      `research_position`-Wert; fehlt er, bleibt der Fall `unresolved` und wird
      als solcher ausgewiesen (nicht stillschweigend zugeordnet).
    legacy_keys:
      # Werte, die in den Kodierungen vorkommen, aber nicht mehr aktiv sind.
      # Nur für den Rollup, keine Wiederbelebung der Kategorien.
      conceptual: unresolved
      test_automation_framework: transformation
    note: >
      Der Rollup ist eine Darstellungsentscheidung des Papers. Er wird als
      abgeleitete Größe berichtet, nicht als kodierte; die Ableitungsregel wird
      im Paper mitgeteilt, und der Anteil `unresolved` wird ausgewiesen.
